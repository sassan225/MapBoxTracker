<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Mapa Tiempo Real - Lukas</title>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
}

#map {
  height: 100vh;
  width: 100%;
}

#info {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  padding: 18px 22px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  font-size: 14px;
  color: white;
  min-width: 220px;
}

#info h2 {
  margin: 0 0 10px 0;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
}

#info div {
  margin-bottom: 6px;
}

#info b {
  color: #ffd369;
}

.footer {
  position: absolute;
  bottom: 15px;
  right: 20px;
  color: white;
  font-size: 13px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="info">
  <h2>Seguimiento en Vivo</h2>
  <div><b>Estudiante:</b> Lukas</div>
  <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.3); margin: 10px 0;">
  <div><b>Usuario:</b> <span id="usuario">-</span></div>
  <div><b>Lat:</b> <span id="latitud">-</span></div>
  <div><b>Lng:</b> <span id="longitud">-</span></div>
  <div><b>Hora:</b> <span id="hora">-</span></div>
</div>

<div class="footer">
  © 2026 Lukas - Mapa en Tiempo Real
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// 🔹 Aquí van tus credenciales de Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCQEdhpOoyczHdlzHKFKEtmsjcOyxP1LfQ",
  authDomain: "mapboxtracker-5b25f.firebaseapp.com",
  databaseURL: "https://mapboxtracker-5b25f-default-rtdb.firebaseio.com",
  projectId: "mapboxtracker-5b25f",
  storageBucket: "mapboxtracker-5b25f.firebasestorage.app",
  messagingSenderId: "151602162192",
  appId: "1:151602162192:android:0036e1d23019a7f6c9f895"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// 🔹 Token de Mapbox
mapboxgl.accessToken = "pk.eyJ1Ijoic2Fzc2FuMzIyIiwiYSI6ImNtbWI3am8zbzBrMm4ycHB1NXdqdXZhNGYifQ.heISc4ptgVEbgPPetUGf1Q";

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/dark-v11',
  center: [-68.15, -16.5], // Cambia a tu ubicación inicial
  zoom: 16
});

const marker = new mapboxgl.Marker({ color: "#ffd369" })
  .setLngLat([-68.15, -16.5])
  .addTo(map);

// 🔹 Conexión Firebase anónima
signInAnonymously(auth).then(() => {

  const ubicacionesRef = ref(db, "usuario1/historial");

  onValue(ubicacionesRef, (snapshot) => {

    const data = snapshot.val();

    if (data) {

      // Tomamos el último registro
      const keys = Object.keys(data);
      const lastKey = keys[keys.length - 1];
      const info = data[lastKey];

      const lat = info.latitud;
      const lng = info.longitud;
      const hora = new Date(info.timestamp).toLocaleString();

      marker.setLngLat([lng, lat]);
      map.flyTo({ center: [lng, lat], speed: 1.2 });

      document.getElementById("usuario").innerText = "usuario1";
      document.getElementById("latitud").innerText = lat.toFixed(6);
      document.getElementById("longitud").innerText = lng.toFixed(6);
      document.getElementById("hora").innerText = hora;

    }

  });

});

</script>

</body>
</html>
